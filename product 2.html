<!doctype html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Barakahh — Product Management</title>
<style>
:root {
  color-scheme: light;
  --bg: #f4f5f7;
  --surface: #ffffff;
  --surface-soft: #f8f9fb;
  --text: #17191f;
  --muted: #737b89;
  --line: #e4e7ed;
  --accent: #17191f;
  --accent-text: #ffffff;
  --success: #167747;
  --success-bg: #e8f7ee;
  --warning: #946200;
  --warning-bg: #fff4d6;
  --danger: #b92f38;
  --danger-bg: #fff0f0;
  --shadow: 0 10px 28px rgba(25, 32, 45, .045);
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #101216;
    --surface: #181b21;
    --surface-soft: #20242c;
    --text: #f4f5f7;
    --muted: #a0a7b4;
    --line: #303540;
    --accent: #f4f5f7;
    --accent-text: #15171b;
    --success: #9be2b4;
    --success-bg: #183426;
    --warning: #ffdf8c;
    --warning-bg: #3b3018;
    --danger: #ffaaaa;
    --danger-bg: #3b2022;
    --shadow: 0 10px 28px rgba(0, 0, 0, .18);
  }
}
* { box-sizing: border-box; }
html { min-height: 100%; scroll-behavior: smooth; }
body {
  margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
  font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  font-size: 14px; line-height: 1.55; -webkit-font-smoothing: antialiased;
}
button, input, textarea, select { font: inherit; }
button {
  min-height: 42px; padding: 10px 15px; border: 1px solid var(--line); border-radius: 11px;
  background: var(--surface); color: var(--text); font-weight: 650; cursor: pointer;
  transition: transform .16s ease, border-color .16s ease, opacity .16s ease;
}
button:hover { border-color: #aeb5c1; transform: translateY(-1px); }
button:active { transform: translateY(0); }
button:disabled { opacity: .55; cursor: not-allowed; transform: none; }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
  outline: 3px solid rgba(88, 130, 255, .28); outline-offset: 2px;
}
.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
.danger { color: var(--danger); }
.nav {
  position: sticky; top: 0; z-index: 5; display: flex; align-items: center;
  justify-content: space-between; gap: 14px; min-height: 70px;
  padding: 14px clamp(16px, 4vw, 42px); background: var(--surface);
  border-bottom: 1px solid var(--line);
}
.nav strong { font-size: 13px; font-weight: 850; letter-spacing: .12em; }
.nav-actions { display: flex; flex-wrap: wrap; gap: 8px; }
main { width: min(100% - 32px, 1180px); margin: 0 auto; padding: 28px 0 60px; }
.hero, .card {
  min-width: 0; padding: clamp(18px, 2.5vw, 28px); margin-bottom: 18px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow);
}
.eyebrow { margin: 0 0 9px; color: var(--muted); font-size: 11px; font-weight: 750; letter-spacing: .15em; text-transform: uppercase; }
h1, h2, h3 { margin: 0 0 10px; color: var(--text); line-height: 1.2; letter-spacing: -.035em; overflow-wrap: anywhere; }
h1 { font-size: clamp(28px, 4vw, 38px); font-weight: 780; }
h2 { font-size: clamp(21px, 2.6vw, 27px); font-weight: 730; }
h3 { font-size: 18px; font-weight: 720; }
p { overflow-wrap: anywhere; }
.muted { color: var(--muted); }
#status { margin-top: 12px; overflow-wrap: anywhere; }
.toolbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.toolbar > div:first-child { min-width: 150px; }
.toolbar > div:last-child { display: flex; align-items: center; gap: 9px; flex: 0 1 auto; }
.search {
  width: min(280px, 100%); min-height: 44px; margin: 0; padding: 11px 14px;
  border: 1px solid var(--line); border-radius: 11px; background: var(--surface-soft); color: var(--text);
}
.product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 265px), 1fr)); gap: 15px; margin-top: 20px; }
.product-card {
  min-width: 0; padding: 18px; border: 1px solid var(--line); border-radius: 16px;
  background: var(--surface-soft); transition: border-color .18s ease, transform .18s ease, box-shadow .18s ease;
}
.product-card:hover { border-color: #b8c0cc; transform: translateY(-2px); box-shadow: var(--shadow); }
.product-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.product-top h3 { flex: 1; margin: 0; }
.badge { display: inline-flex; align-items: center; justify-content: center; max-width: 100%; padding: 5px 9px; border-radius: 99px; background: var(--surface); border: 1px solid var(--line); color: var(--muted); font-size: 11px; font-weight: 700; white-space: nowrap; }
.price { margin: 14px 0; color: var(--text); font-size: 24px; font-weight: 800; letter-spacing: -.04em; }
.variant { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 13px; }
.variant > * { overflow-wrap: anywhere; }
.ok { color: var(--success); }
.low { color: var(--warning); }
.zero { color: var(--danger); }
.actions { display: flex; gap: 9px; margin-top: 16px; }
.actions button { flex: 1; min-width: 0; }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 17px; }
label { display: block; min-width: 0; color: var(--text); font-size: 13px; font-weight: 650; }
input, textarea, select {
  display: block; width: 100%; min-width: 0; min-height: 44px; margin-top: 7px;
  padding: 11px 13px; border: 1px solid var(--line); border-radius: 11px;
  background: var(--surface-soft); color: var(--text); outline: none;
}
input:focus, textarea:focus, select:focus { border-color: #8995a8; }
input[readonly] { opacity: .8; }
input[type="file"] { padding: 9px; }
textarea { min-height: 100px; resize: vertical; }
.full { grid-column: 1 / -1; }
.colour-block { margin-top: 12px; padding: 15px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface-soft); }
.colour-head { display: flex; align-items: end; gap: 10px; }
.colour-head label { flex: 1; }
.size-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 12px; }
.form-actions { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 9px; margin-top: 22px; }
#formMessage { margin-top: 12px; overflow-wrap: anywhere; }
.existing-photos { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
.existing-photo { width: 104px; height: 104px; overflow: hidden; border: 1px solid var(--line); border-radius: 12px; background: var(--surface-soft); }
.existing-photo img { display: block; width: 100%; height: 100%; object-fit: cover; }
.empty { padding: 34px 18px; color: var(--muted); text-align: center; border: 1px dashed var(--line); border-radius: 13px; }
[hidden] { display: none !important; }
@media (max-width: 700px) {
  .nav { position: relative; flex-wrap: wrap; padding: 13px 15px; }
  .nav strong { flex: 1 1 100%; }
  .nav-actions { width: 100%; }
  .nav-actions button { flex: 1; }
  main { width: min(100% - 24px, 560px); padding: 18px 0 36px; }
  .hero, .card { padding: 18px; border-radius: 15px; margin-bottom: 14px; }
  .toolbar { align-items: stretch; }
  .toolbar > div:first-child { width: 100%; }
  .toolbar > div:last-child { width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) auto; }
  .search { width: 100%; min-width: 0; }
  .product-grid { grid-template-columns: minmax(0, 1fr); gap: 12px; margin-top: 16px; }
  .product-card { padding: 16px; }
  .form-grid { grid-template-columns: minmax(0, 1fr); gap: 15px; }
  .full { grid-column: auto; }
  .size-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .form-actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .form-actions button { width: 100%; }
}
@media (max-width: 390px) {
  .toolbar > div:last-child { grid-template-columns: minmax(0, 1fr); }
  .actions { flex-direction: column; }
  .actions button { width: 100%; }
  .colour-head { align-items: stretch; flex-direction: column; }
  .colour-head button { width: 100%; }
  .form-actions { grid-template-columns: minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; }
}
</style></head>
<body>
<header class="nav"><strong>BARAKAHH ADMIN</strong><div class="nav-actions"><button id="backButton">Dashboard</button><button id="logout">Sign out</button></div></header>
<main>
<section class="hero"><p class="eyebrow">PRODUCT MANAGEMENT</p><h1>Products</h1><p class="muted">Manage products, colour/size stock and customer visibility.</p><p id="status" class="muted">Checking authentication…</p></section>
<section class="card"><div class="toolbar"><div><p class="eyebrow">CATALOG</p><h2>Product List</h2></div><div><input id="search" class="search" placeholder="Search products…"><button id="addProduct" class="primary">+ Add Product</button></div></div><div id="productList" class="product-grid"><div class="empty">Loading products…</div></div></section>
<section class="card" id="editorCard" hidden><p class="eyebrow">PRODUCT EDITOR</p><h2 id="editorTitle">Add Product</h2>
<form id="productForm"><div class="form-grid">
<label>Product name<input id="name" required maxlength="100" placeholder="Faith Print"></label>
<label>Category
  <select id="category">
    <option value="TS">T-Shirt</option>
    <option value="HD">Hoodie</option>
  </select>
</label>
<label>SKU / Product ID<input id="sku" readonly required maxlength="40" placeholder="BHK-TS-001"></label>
<label>Price (₹)<input id="price" type="number" min="0" value="499" required></label>
<label>Status<select id="productStatus"><option>Active</option><option>Hidden</option><option>Out of Stock</option></select></label>
<label class="full">Description<textarea id="description" maxlength="1000"></textarea></label>
<label class="full">Product Photos<input id="photos" type="file" accept="image/*" multiple><div id="existingPhotos" class="existing-photos" hidden></div></label>
<div class="full"><label>Colour & size stock</label><div id="variants"></div><button type="button" id="addColour" style="margin-top:10px">+ Add Colour</button></div>
</div><div class="form-actions"><button type="button" id="cancelEdit">Cancel</button><button type="submit" class="primary" id="saveProduct">Save Product</button></div><p id="formMessage" class="muted"></p></form>
</section></main>
<script type="module" src="./products.js"></script></body></html>
