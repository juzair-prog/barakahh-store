<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Barakahh Admin</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="auth">
    <section class="card">
      <p class="eyebrow">BARAKAHH ADMIN</p>
      <h1>Admin Login</h1>
      <form id="loginForm">
        <label>Email<input id="email" type="email" required autocomplete="username"></label>
        <label>Password<input id="password" type="password" required autocomplete="current-password"></label>
        <button class="button" type="submit">Sign in</button>
        <p id="message" class="muted"></p>
      </form>
    </section>
  </main>
  <script type="module" src="admin.js"></script>
</body>
</html>
